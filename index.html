<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WoW Stat Solver - Select Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      body {
        background-color: #0f172a;
        font-family: system-ui, -apple-system, sans-serif;
      }
    </style>
  </head>
  <body class="h-screen flex items-center justify-center text-slate-300">
    <div class="max-w-2xl w-full p-8 text-center space-y-10">
      <div class="space-y-2">
        <h1 class="text-4xl font-bold text-white tracking-tight">
          WoW Stat Solver
        </h1>
        <p class="text-slate-500">
          Optimal Distribution & Segmented Fitting Tool
        </p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Online Card -->
        <a
          href="OnlineVersion/index.html"
          class="group block bg-slate-800/50 border border-slate-700 hover:border-indigo-500 rounded-xl p-8 transition-all hover:bg-slate-800 hover:shadow-2xl hover:shadow-indigo-500/10"
        >
          <div
            class="w-12 h-12 bg-indigo-500/10 text-indigo-400 rounded-lg flex items-center justify-center text-2xl mb-4 mx-auto group-hover:scale-110 transition-transform"
          >
            <i class="fa-solid fa-globe"></i>
          </div>
          <h2 class="text-xl font-bold text-white mb-2">Online Version</h2>
          <p class="text-sm text-slate-400 leading-relaxed">
            Lightweight, CDN-based.<br />Recommended for most users.
          </p>
        </a>

        <!-- Local Card -->
        <a
          href="LocalVersion/index.html"
          class="group block bg-slate-800/50 border border-slate-700 hover:border-emerald-500 rounded-xl p-8 transition-all hover:bg-slate-800 hover:shadow-2xl hover:shadow-emerald-500/10"
        >
          <div
            class="w-12 h-12 bg-emerald-500/10 text-emerald-400 rounded-lg flex items-center justify-center text-2xl mb-4 mx-auto group-hover:scale-110 transition-transform"
          >
            <i class="fa-solid fa-download"></i>
          </div>
          <h2 class="text-xl font-bold text-white mb-2">Local Version</h2>
          <p class="text-sm text-slate-400 leading-relaxed">
            Fully offline, zero dependencies.<br />Good for local archiving.
          </p>
        </a>
      </div>

      <div class="text-xs text-slate-600">
        v1.1.0 • <a href="PROJECT_STATUS.md" class="hover:text-slate-400 underline">Dev Logs</a>
      </div>
    </div>
  </body>
</html>
